[project]
name = "vrag"
version = "0.1.0"
description = "Multimodal video RAG over YouTube videos with EmbeddingGemma 2 + Gemma 4 12B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "torchvision",
    "torchaudio",
    "transformers>=5.19.0",
    "sentence-transformers>=6.1.0",
    "torchcodec",
    "accelerate",
    "numpy",
    "pillow",
    "av",
    "soundfile",
    "librosa",
    "yt-dlp[default,curl-cffi]",
    "webvtt-py",
    "jiwer",
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "openai>=1.40",
    "httpx",
    "rich",
    "typer",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vrag"]

[project.scripts]
vrag = "vrag.cli:app"
