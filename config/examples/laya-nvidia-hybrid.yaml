version: 1
profile: laya-nvidia-hybrid
providers:
  laya:
    label: Needle Router Laya Vision
    adapter: laya-vision
    base_url_env: LAYA_BASE_URL
    model: thaitea/laya-vision
    capabilities:
    - image_understanding
    - visual_decision
    trust: approved_sensitive
    timeout_ms: 60000
    concurrency: 1
  detector:
    adapter: detection-http
    base_url_env: NVIDIA_DETECTION_BASE_URL
    api_key_secret: NVIDIA_DETECTION_API_KEY
    model: replace-with-verified-gateway-model
    capabilities:
    - object_detection
    - bounding_boxes
    trust: approved_sensitive
features:
  live.camera1.scene:
    strategy: single
    providers:
    - laya
  live.camera2.scene:
    strategy: single
    providers:
    - laya
  live.visual_decision:
    strategy: single
    providers:
    - laya
  live.camera2.detection:
    strategy: parallel
    providers:
    - laya
    - detector
    result_policy: all
    fusion: spatial_semantic
