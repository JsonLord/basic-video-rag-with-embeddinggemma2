name: Coordinate private Space GitHub checkpoint
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-production
  cancel-in-progress: false
jobs:
  checkpoint:
    if: vars.BACKUPS_APPROVED == 'true' && vars.COORDINATOR_VALIDATED == 'true'
    environment: private-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install httpx==0.28.1
      - name: Verify private Space reachability and completed checkpoint
        env:
          VM_SPACE_ID: ${{ vars.VM_SPACE_ID }}
          VM_SPACE_URL: ${{ vars.VM_SPACE_URL }}
          HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          VM_BACKUP_TRIGGER_TOKEN: ${{ secrets.VM_BACKUP_TRIGGER_TOKEN }}
        run: python scripts/coordinate_backup.py
