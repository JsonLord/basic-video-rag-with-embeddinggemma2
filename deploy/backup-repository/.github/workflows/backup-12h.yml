name: Encrypted durable-state backup
on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: backup-production
  cancel-in-progress: false
jobs:
  snapshot:
    if: vars.BACKUPS_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: private-backup
    env:
      GH_TOKEN: ${{ github.token }}
      BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify private destination
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          test -n "$BACKUP_REMOTE" && test -n "$AGE_RECIPIENT"
      - name: Install export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age rclone
          python -m pip install pydantic==2.14.0 PyYAML==6.0.3
      - name: Fetch immutable durable source with bounded retries
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RCLONE_CONFIG_BASE64" | base64 --decode > "$RCLONE_CONFIG"
          for attempt in 1 2 3; do
            if python scripts/fetch_backup_source.py --remote "$BACKUP_REMOTE" --output "$RUNNER_TEMP/source-$attempt" > "$RUNNER_TEMP/source-id"; then
              echo "SOURCE_DIR=$RUNNER_TEMP/source-$attempt" >> "$GITHUB_ENV"
              break
            fi
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
      - name: Encrypt snapshot before entering GitHub
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "SNAPSHOT=snapshots/$stamp.age" >> "$GITHUB_ENV"
          python scripts/backup_state.py --data-root "$SOURCE_DIR/data" --state-root "$SOURCE_DIR/state" --assets-root "$SOURCE_DIR/assets" --output "snapshots/$stamp.age" --recipient "$AGE_RECIPIENT" --source-snapshot-id "$(cat "$RUNNER_TEMP/source-id")"
      - name: Apply conservative retention
        run: python scripts/prune_backups.py snapshots --apply
      - name: Commit, upload and verify ciphertext
        run: |
          git config user.name 'Private Backup'
          git config user.email 'backup@users.noreply.github.com'
          git add snapshots
          git commit -m "Encrypted backup $GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            git push origin HEAD && break
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
          git fetch origin
          git show "origin/$(git branch --show-current):$SNAPSHOT" > "$RUNNER_TEMP/remote.age"
          cmp "$SNAPSHOT" "$RUNNER_TEMP/remote.age"
      - name: Report verified remote upload
        env:
          RESTORE_EVIDENCE: ${{ vars.RESTORE_EVIDENCE_SHA256 }}
        run: |
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          envelope=json.loads(Path(os.environ['SNAPSHOT']).with_suffix('.json').read_text())
          # Restore evidence is supplied only after an independent recovery-key restore.
          evidence=os.environ.get('RESTORE_EVIDENCE','')
          report={'last_attempt':time.time(),'last_verified_success':time.time(),'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'private_repository_verified':True,'coverage_verified':envelope['coverage_verified'],'restore_verified':len(evidence)==64 and all(c in '0123456789abcdef' for c in evidence)}
          Path('status.json').write_text(json.dumps(report))
          PY
          git add status.json
          git commit -m "Record verified backup run $GITHUB_RUN_ID"
          git push origin HEAD
      - name: Alert on failure
        if: failure()
        run: |
          gh issue create --title 'Private backup failed' --body "Backup run $GITHUB_RUN_ID failed. Review private Actions logs; no backup success is claimed."
      - name: Remove plaintext working files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP"/source-* "$RCLONE_CONFIG" "$RUNNER_TEMP/remote.age"
