name: Monitor actual successful backup age
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: backup-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check latest success and restore sign-off
        id: check
        continue-on-error: true
        run: |
          python -m pip install pydantic==2.14.0 PyYAML==6.0.3
          python scripts/check_backup.py status.json
      - name: Alert once while unhealthy
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh issue list --state open --search 'Backup stale or unverified in:title' --json number --jq length)"
          test "$count" -gt 0 || gh issue create --title 'Backup stale or unverified' --body 'Last verified backup is missing, older than 14 hours, or lacks independent restore evidence. Check Actions and durable source. GitHub schedules may be delayed.'
